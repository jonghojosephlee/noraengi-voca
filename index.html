<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노랭이 보카</title>
<meta name="description" content="노랭이 단어장을 카드와 퀴즈로 쉽게 외우는 간격 반복 단어장">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="노랭이 보카">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500..900&family=Nunito:wght@600..1000&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f7; --surface-3:#e5e5e5; --ink:#3c3c3c; --ink-2:#6f6f6f; --ink-3:#a3a3a3; --line:#e5e5e5; --line-2:#d4d4d4;
  --green:#2dbe60; --green-btn:#189a4c; --green-deep:#127a3a; --green-ink:#137a3c; --green-soft:#e3f7ea; --green-mid:#a6e6bb; --accent-ink:#ffffff;
  --blue:#1487d6; --blue-2:#1cb0f6; --blue-deep:#0f6bab; --blue-soft:#e4f4fd;
  --red:#e5484d; --red-deep:#b8363a; --red-ink:#c9363b; --red-soft:#ffe8e8;
  --gold:#ffc21a; --gold-deep:#e0a200; --gold-ink:#7a5a00; --gold-soft:#fff5d6;
  --orange:#ff9a1f; --orange-deep:#e07b00; --orange-ink:#b35900; --orange-soft:#fff1e0;
  --purple:#a36cf2; --purple-deep:#7d4fd0; --purple-soft:#f2eafe;
  --face:#233033; --hole:#e5e5e5;
  --f:"Nunito","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px; --tabs-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131f24; --surface:#16252b; --surface-2:#1c2e35; --surface-3:#2a3f47; --ink:#f1f7f7; --ink-2:#a9b9be; --ink-3:#6f848b; --line:#2b3f47; --line-2:#3a525b;
    --green:#3ccb6d; --green-btn:#2bb35e; --green-deep:#1b7c40; --green-ink:#62d88c; --green-soft:#173a27; --green-mid:#276b43; --accent-ink:#04200f;
    --blue:#3fb0f6; --blue-2:#3fb0f6; --blue-deep:#1c78b3; --blue-soft:#13303f;
    --red:#ff6b6f; --red-deep:#b8363a; --red-ink:#ff8a8d; --red-soft:#3b1d20;
    --gold:#ffcc33; --gold-deep:#b58600; --gold-ink:#ffd666; --gold-soft:#3a3014;
    --orange:#ffa53a; --orange-deep:#b86400; --orange-ink:#ffb65c; --orange-soft:#3a2a14;
    --purple:#b98af5; --purple-deep:#7d4fd0; --purple-soft:#2c2140;
    --face:#10191c; --hole:#131f24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131f24; --surface:#16252b; --surface-2:#1c2e35; --surface-3:#2a3f47; --ink:#f1f7f7; --ink-2:#a9b9be; --ink-3:#6f848b; --line:#2b3f47; --line-2:#3a525b;
  --green:#3ccb6d; --green-btn:#2bb35e; --green-deep:#1b7c40; --green-ink:#62d88c; --green-soft:#173a27; --green-mid:#276b43; --accent-ink:#04200f;
  --blue:#3fb0f6; --blue-2:#3fb0f6; --blue-deep:#1c78b3; --blue-soft:#13303f;
  --red:#ff6b6f; --red-deep:#b8363a; --red-ink:#ff8a8d; --red-soft:#3b1d20;
  --gold:#ffcc33; --gold-deep:#b58600; --gold-ink:#ffd666; --gold-soft:#3a3014;
  --orange:#ffa53a; --orange-deep:#b86400; --orange-ink:#ffb65c; --orange-soft:#3a2a14;
  --purple:#b98af5; --purple-deep:#7d4fd0; --purple-soft:#2c2140;
  --face:#10191c; --hole:#131f24;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:600;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:3px;border-radius:12px}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.muted{color:var(--ink-2)}

/* layout */
.screen{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.screen.tabbed{padding-bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.flow .wrap{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 36px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.topbar h1{font-size:24px;font-weight:900;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green-ink);letter-spacing:-.01em}
.brand .mascot{width:34px;height:34px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:26px;height:26px}
.card,.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec h2{font-size:19px;font-weight:900;white-space:nowrap}
.sec span,.sec button{font-size:14px;color:var(--ink-2);font-weight:700}
.sec span{text-align:right}
.eyebrow{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.02em}

/* chunky buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.02em;background:var(--green-btn);color:var(--accent-ink);box-shadow:0 4px 0 var(--green-deep);transition:transform .08s,box-shadow .08s,filter .15s;width:100%}
.btn svg{width:22px;height:22px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--green-deep)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{background:var(--surface-3);color:var(--ink-3);box-shadow:0 4px 0 var(--line-2)}
.btn.alt{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.alt:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.btn.bad{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep)}
.btn.gold{background:var(--gold);color:#4a3600;box-shadow:0 4px 0 var(--gold-deep)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn.sm{min-height:42px;font-size:15px;border-radius:13px;padding:0 14px;width:auto}
.row{display:flex;gap:12px}
.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-size:14.5px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-2);box-shadow:0 2px 0 var(--blue-2)}
.chip svg{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-size:14.5px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:0 2px 0 var(--line-2)}

/* mascot */
.mascot{width:110px;height:110px;overflow:visible;flex:none}
.mascot .m-shadow{fill:rgb(0 0 0 / .12)}
.mascot .m-stem{stroke:#1f9a4d;stroke-width:4.6;stroke-linecap:round;fill:none}
.mascot .m-leaf1{fill:#7fe3a1}
.mascot .m-leaf2{fill:#3fc46d}
.mascot .m-blob{fill:var(--pet,var(--green))}
.mascot .m-blob{stroke:rgb(0 0 0 / .07);stroke-width:1.2}
.mascot .m-shade{fill:#000;opacity:.07}
.mascot .m-shine{fill:#fff;opacity:.5}
.mascot .m-vein{stroke:#fff;stroke-width:1.7;stroke-linecap:round;fill:none;opacity:.5}
.mascot .m-cheek2{fill:#ff6f96;opacity:.3}
.mascot .m-tear{fill:#6ec1ff;stroke:#fff;stroke-width:.9;display:none}
.mascot[data-mood="sad"] .m-tear{display:inline}
.mascot .m-all>.m-blob,.mascot .m-all>.m-shade,.mascot .m-all>.m-belly{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
@media (prefers-reduced-motion: reduce){.mascot .m-all>.m-blob,.mascot .m-all>.m-shade,.mascot .m-all>.m-belly{animation:none}}
.mascot .m-belly{fill:#fff;opacity:.16}
.mascot .m-pupil{fill:var(--face)}
.mascot .m-line{stroke:var(--face);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.mascot .m-cheek{fill:#ff8fab;opacity:.42}
.mascot .m-fill{fill:var(--face)}
.mascot .m-tongue{fill:#ff7a8a}
.mascot .m-spark{fill:var(--gold)}
.mascot .m-zz{fill:var(--ink-3);font:900 16px var(--f)}
.mascot .m-x,.mascot .m-open,.mascot .m-joy,.mascot .m-sad,.mascot .m-sleep,.mascot .m-smile,.mascot .m-grin,.mascot .m-frown,.mascot .m-o,.mascot .m-spark,.mascot .m-zz{display:none}
.mascot[data-mood="idle"] .m-open,.mascot[data-mood="idle"] .m-smile{display:inline}
.mascot[data-mood="happy"] .m-joy,.mascot[data-mood="happy"] .m-grin,.mascot[data-mood="happy"] .m-spark{display:inline}
.mascot[data-mood="wow"] .m-open,.mascot[data-mood="wow"] .m-grin,.mascot[data-mood="wow"] .m-spark{display:inline}
.mascot[data-mood="sad"] .m-sad,.mascot[data-mood="sad"] .m-frown{display:inline}
.mascot[data-mood="sleep"] .m-sleep,.mascot[data-mood="sleep"] .m-o,.mascot[data-mood="sleep"] .m-zz{display:inline}
.mascot .m-open{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.mascot .m-leaves{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
.mascot.float .m-all{animation:float 3.4s ease-in-out infinite}
.mascot.hop .m-all{animation:hop .9s cubic-bezier(.3,1.6,.5,1) 3}
.mascot.shake .m-all{animation:shakeM .45s}
.mascot .m-all{transform-box:fill-box;transform-origin:50% 100%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(0) scaleY(.9)}55%{transform:translateY(-18px) scaleY(1.04)}}
@keyframes shakeM{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 15px;font-size:16px;font-weight:800;line-height:1.45;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;top:24px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-7.5px;top:26px;border:7px solid transparent;border-right-color:var(--surface);border-left:0}
.charrow{display:flex;align-items:flex-start;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:2px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabs-h);padding:6px 0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink-3);border-radius:14px;border:2px solid transparent;margin:0 4px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-2)}

/* home */
.tstats{display:flex;align-items:center;gap:4px}
.tchip{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;padding:6px 8px;border-radius:12px;color:var(--ink-3)}
.tchip svg{width:26px;height:26px}
.tchip.flame.on{color:var(--orange)}
.tchip.xp{color:var(--gold-deep)}
.hero{padding:18px 18px 20px;display:flex;flex-direction:column;gap:16px}
.hero .bubble{font-size:17px}
.hero .bubble small{display:block;font-size:14px;font-weight:700;color:var(--ink-2);margin-top:2px}
.goal{display:flex;flex-direction:column;gap:6px}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:var(--ink-2)}
.goal-top b{color:var(--gold-deep);display:flex;align-items:center;gap:3px}
.goal-top b svg{width:18px;height:18px}
.bar{height:16px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--gold);transition:width .5s cubic-bezier(.3,.9,.3,1)}
.bar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgb(255 255 255 / .38)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.count b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:14px;font-weight:800;color:var(--ink-2)}
.count.rev b{color:var(--blue)}
.count.new b{color:var(--green-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 10px 12px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink-3)}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center}
.wk i svg{width:22px;height:22px;opacity:.35;filter:grayscale(1)}
.wk.part i{background:var(--orange-soft)}
.wk.part i svg{opacity:.7;filter:none}
.wk.done i{background:var(--orange-soft);box-shadow:inset 0 0 0 2px var(--orange)}
.wk.done i svg{opacity:1;filter:none}
.wk.today span{color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qk{display:flex;align-items:center;gap:11px;padding:13px 12px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:left;transition:transform .08s,box-shadow .08s}
.qk:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.qk i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.qk i svg{width:24px;height:24px}
.qk b{display:block;font-size:15.5px;font-weight:900}
.qk small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.35}
.i-green{background:var(--green-soft);color:var(--green-ink)}
.i-red{background:var(--red-soft);color:var(--red-ink)}
.i-gold{background:var(--gold-soft);color:var(--gold-deep)}
.i-blue{background:var(--blue-soft);color:var(--blue)}
.i-purple{background:var(--purple-soft);color:var(--purple)}
.banner{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--gold-soft);border:2px solid var(--gold);color:var(--ink);font-size:14px;font-weight:700;line-height:1.5}
.banner svg{width:24px;height:24px;flex:none;color:var(--gold-deep)}
.banner.green{background:var(--green-soft);border-color:var(--green)}
.banner.green svg{color:var(--green-ink)}

/* learning path */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding-bottom:8px}
.unit{width:100%;border-radius:18px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 40px;box-shadow:0 4px 0 var(--ud)}
.unit b{display:block;font-size:13px;font-weight:900;opacity:.85;letter-spacing:.04em}
.unit strong{display:block;font-size:19px;font-weight:900}
.unit span{font-size:13.5px;font-weight:800;opacity:.92;text-align:right;white-space:nowrap}
.pnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;transform:translateX(var(--x,0))}
.pnode .nb{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center}
.pnode .nb svg.ring{position:absolute;inset:-9px;width:96px;height:96px;transform:rotate(-90deg)}
.pnode .nb i{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--uc);color:#fff;box-shadow:0 6px 0 var(--ud);font-style:normal;font-size:23px;font-weight:900;transition:transform .08s,box-shadow .08s}
.pnode .nb i svg{width:34px;height:34px}
.pnode:active .nb i{transform:translateY(6px);box-shadow:0 0 0 var(--ud)}
.pnode.todo .nb i{background:var(--surface-3);color:var(--ink-3);box-shadow:0 6px 0 var(--line-2)}
.pnode.full .nb i{background:var(--gold);color:#6b4d00;box-shadow:0 6px 0 var(--gold-deep)}
.pnode.cur .nb::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:4px solid var(--uc);opacity:.35;animation:pulse2 1.8s ease-out infinite}
@keyframes pulse2{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.18);opacity:0}}
.pnode small{font-size:13px;font-weight:900;color:var(--ink-2)}
.startpop{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 var(--line);animation:bob 1.6s ease-in-out infinite;z-index:2}
.startpop::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--surface);border-bottom:0}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;font-weight:800;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:block}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;min-height:52px}
.qhead .ibtn{color:var(--ink-3)}
.qbar{flex:1;height:18px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.qbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.3,1.3,.4,1)}
.qbar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:5px;border-radius:5px;background:rgb(255 255 255 / .35)}
.combo{display:flex;align-items:center;gap:2px;font-weight:900;font-size:17px;color:var(--orange);font-variant-numeric:tabular-nums;min-width:48px;justify-content:flex-end}
.combo svg{width:24px;height:24px}
.combo.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.qbody{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.qtag{align-self:flex-start;font-size:13px;font-weight:900;padding:4px 11px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);letter-spacing:.02em}
.qtag.rev{background:var(--blue-soft);color:var(--blue)}
.qtag.again{background:var(--red-soft);color:var(--red-ink)}
.qtag.test{background:var(--purple-soft);color:var(--purple)}
.qprompt{font-size:23px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.qchar{display:flex;align-items:flex-end;gap:10px}
.qchar .mascot{width:88px;height:88px}
.qchar .bubble{align-self:center}
.qchar .bubble::before{top:auto;bottom:22px}
.qchar .bubble::after{top:auto;bottom:24px}
.qword{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qword .w{font-size:clamp(30px,8.6vw,40px);font-weight:900;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere;color:var(--ink)}
.qword .w.long{font-size:clamp(24px,6.8vw,32px)}
.say{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue-2);color:#fff;box-shadow:0 4px 0 var(--blue-deep);flex:none;transition:transform .08s,box-shadow .08s}
.say:active{transform:translateY(4px);box-shadow:0 0 0 var(--blue-deep)}
.say svg{width:25px;height:25px}
.say.big{width:108px;height:108px;border-radius:28px;box-shadow:0 6px 0 var(--blue-deep)}
.say.big svg{width:54px;height:54px}
.say.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.qmean{font-size:clamp(21px,5.8vw,25px);font-weight:900;line-height:1.35;text-wrap:balance}
.qhint{font-size:16px;font-weight:700;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:2px}
.opt{width:100%;text-align:left;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:800;line-height:1.35;display:flex;gap:12px;align-items:center;min-height:60px;transition:transform .08s,box-shadow .08s,background-color .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--ink-3);flex:none}
.opt.en{font-size:19px;color:var(--ink);font-weight:800;line-height:1.35;margin-top:0}
.opt.right{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green);color:var(--green-ink)}
.opt.right .k{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 4px 0 var(--red);color:var(--red-ink);animation:shake .4s}
.opt.wrong .k{border-color:var(--red);background:var(--red);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.spell{display:flex;flex-direction:column;gap:12px}
.spell input{width:100%;font-size:24px;font-weight:800;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);outline:none;box-shadow:0 4px 0 var(--line)}
.spell input:focus{border-color:var(--blue-2);background:var(--surface)}
.spell input.right{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.spell input.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-ink);animation:shake .4s}
.slots{font-size:17px;font-weight:900;letter-spacing:.22em;color:var(--ink-3)}
/* sentence questions */
.qsent{font-size:clamp(18px,5vw,21px);font-weight:700;line-height:1.55;color:var(--ink);text-wrap:pretty}
.qsent mark{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 4px;box-shadow:inset 0 -3px 0 var(--gold);font-weight:900}
.qsent .blank{display:inline-block;width:4.4em;height:1.05em;border-bottom:3px solid var(--blue-2);vertical-align:-3px;margin:0 3px}
.qsko{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink-2);line-height:1.5}
/* pairs round */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{min-height:58px;padding:8px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-size:15.5px;font-weight:800;line-height:1.3;text-align:center;overflow-wrap:anywhere;color:var(--ink);transition:transform .08s,box-shadow .08s,background-color .15s,border-color .15s,opacity .25s}
.mt.en{font-size:17.5px;color:var(--ink);font-weight:800;line-height:1.3;margin-top:0}
.mt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.mt.sel{border-color:var(--blue-2);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue-2);color:var(--blue)}
.mt.ok{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green);color:var(--green-ink);opacity:.5}
.mt.bad{border-color:var(--red);background:var(--red-soft);box-shadow:0 4px 0 var(--red);color:var(--red-ink);animation:shake .4s}
.qfoot{position:sticky;bottom:0;padding-top:14px;padding-bottom:4px;background:linear-gradient(to top,var(--bg) 72%,transparent)}

/* learn card + flashcards */
.lcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;position:relative}
.idx{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.04em;color:var(--ink-3)}
.hole{width:16px;height:16px;border-radius:50%;background:var(--hole);box-shadow:inset 0 2px 3px rgb(0 0 0 / .22);flex:none;margin-right:2px}
.lword{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.lword .w{font-size:clamp(30px,8.6vw,40px);font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.senses{display:flex;flex-direction:column;gap:13px}
.senses li{display:flex;gap:10px}
.senses .no{width:24px;height:24px;border-radius:8px;background:var(--green-soft);color:var(--green-ink);font-size:13px;font-weight:900;display:grid;place-items:center;flex:none;margin-top:3px}
.senses .exs{margin-top:7px;font-size:15px;font-weight:600;line-height:1.5;color:var(--ink-2)}
.senses .exs b{color:var(--ink);font-weight:900}
.senses .exk{margin-top:1px;font-size:14px;font-weight:600;line-height:1.5;color:var(--ink-3)}
.ko{font-size:19px;font-weight:800;line-height:1.4}
.en{font-size:16.5px;font-weight:700;color:var(--ink-2);line-height:1.4;margin-top:2px}
.syn{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.note{font-size:14.5px;font-weight:700;color:var(--ink);background:var(--orange-soft);border-radius:14px;padding:10px 12px;line-height:1.5}
.note b{display:block;font-size:12.5px;font-weight:900;color:var(--orange-ink);margin-bottom:2px}
.fixnote{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.stage{position:relative;height:min(54vh,460px);min-height:310px}
.deck{position:absolute;inset:0;border-radius:22px;background:var(--surface);border:2px solid var(--line)}
.deck.d1{transform:translateY(10px) scale(.965);opacity:.8}
.deck.d2{transform:translateY(20px) scale(.93);opacity:.5}
.drag{position:absolute;inset:0;touch-action:pan-y;perspective:1400px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.2,.75,.25,1);cursor:pointer;border-radius:22px;outline:none}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;overflow:hidden}
.face.back{transform:rotateY(180deg);overflow-y:auto;overscroll-behavior:contain}
.face > .say{position:absolute;top:14px;right:14px}   /* only a face's own corner button: the small meaning/example buttons stay in their rows */
.face .fw{font-weight:900;font-size:clamp(34px,10vw,48px);line-height:1.08;text-align:center;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere;padding-inline:6px}
.face .fw.long{font-size:clamp(26px,7.6vw,36px)}
.face .fk{margin:auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.face .fk p{font-size:clamp(21px,6vw,27px);font-weight:900;line-height:1.35;text-wrap:balance}
.hint{text-align:center;font-size:14px;font-weight:800;color:var(--ink-3)}
.stamp{position:absolute;top:30px;padding:5px 14px;border-radius:12px;border:3px solid;font-weight:900;font-size:22px;opacity:0;pointer-events:none;z-index:3;background:var(--surface)}
.s-know{left:22px;color:var(--green);border-color:var(--green);transform:rotate(-9deg)}
.s-dont{right:22px;color:var(--red);border-color:var(--red);transform:rotate(9deg)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navrow .ibtn{width:58px;height:58px;border-radius:18px;background:var(--surface);color:var(--ink-2);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.navrow .ibtn.on{color:var(--gold-deep);border-color:var(--gold);box-shadow:0 4px 0 var(--gold-deep);background:var(--gold-soft)}
.navrow .ibtn.on svg{fill:currentColor}
.navrow .ibtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.pos{font-size:14px;font-weight:900;color:var(--ink-2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--green)}

/* feedback sheet */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--green-soft);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.12)}
.fb.show{transform:none}
.fb.bad{background:var(--red-soft)}
.fb .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb .hd{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--green-ink)}
.fb.bad .hd{color:var(--red-ink)}
.fb .hd i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--green);flex:none}
.fb.bad .hd i{color:var(--red)}
.fb .hd i svg{width:22px;height:22px}
.fb .hd .xp{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:16px;color:var(--gold-ink)}
.fb .hd .xp svg{width:19px;height:19px}
.fb .ans{font-size:15.5px;font-weight:700;line-height:1.5;color:var(--ink)}
.fb .ans .w{font-weight:900;font-size:20px}
.fb .ans .m{color:var(--ink-2)}
.fb.bad .ans b{color:var(--red-ink)}
.fb .ans .ex{margin-top:6px}
.fb .ans .ex p{font-size:15.5px;font-weight:600;line-height:1.5}
.fb .ans .ex p b{color:inherit;font-weight:900}
.fb .ans .ex small{display:block;margin-top:2px;font-size:14px;font-weight:600;line-height:1.45;color:var(--ink-2)}

/* result */
.result{align-items:center;text-align:center;justify-content:center;gap:18px;padding-top:18px}
.result .mascot{width:150px;height:150px}
.result h1{font-size:30px;font-weight:900;color:var(--gold-deep);letter-spacing:-.01em}
.result h1.green{color:var(--green-ink)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rs{border-radius:16px;border:2px solid var(--c);background:var(--c);overflow:hidden}
.rs small{display:block;font-size:12px;font-weight:900;color:#fff;padding:5px 4px 4px;letter-spacing:.04em}
.rs b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:900;color:var(--c);background:var(--surface);border-radius:13px;padding:10px 4px;font-variant-numeric:tabular-nums}
.rs b svg{width:20px;height:20px}
.rs.gold{--c:var(--gold)} .rs.gold b{color:var(--gold-deep)}
.rs.green{--c:var(--green)} .rs.green b{color:var(--green-ink)}
.rs.blue{--c:var(--blue-2)} .rs.blue b{color:var(--blue)}
.streakbig{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--orange-soft);border:2px solid var(--orange);width:100%;text-align:left}
.streakbig svg{width:44px;height:44px;flex:none;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.1) rotate(-4deg)}}
.streakbig b{display:block;font-size:18px;font-weight:900;color:var(--orange-ink)}
.streakbig small{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.score{position:relative;width:150px;height:150px}
.score svg{width:150px;height:150px;transform:rotate(-90deg)}
.score .v{position:absolute;inset:0;display:grid;place-items:center;line-height:1.1}
.score .v b{font-size:40px;font-weight:900}
.score .v small{display:block;font-size:14px;font-weight:800;color:var(--ink-2)}
.result .wlist{width:100%;text-align:left}

/* word lists */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:0 13px}
.search svg{width:21px;height:21px;color:var(--ink-3);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:700;padding:13px 0;min-width:0}
.list{display:flex;flex-direction:column;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:2px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:900;font-size:16px}
.li .t small{display:block;font-size:13px;font-weight:700;color:var(--ink-2)}
.li .mb{width:80px;height:10px;border-radius:10px;background:var(--surface-3);overflow:hidden;display:flex;flex:none}
.li .mb i{display:block;height:100%}
.mb .m{background:var(--green)} .mb .l{background:var(--green-mid)}
.li .go{width:20px;height:20px;color:var(--ink-3);flex:none}
.li .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.li .ic svg{width:23px;height:23px}
.li .dnum{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--uc,var(--green));color:#fff;font-size:15px;font-weight:900;box-shadow:0 3px 0 var(--ud,var(--green-deep))}
.li .dnum.todo{background:var(--surface-3);color:var(--ink-3);box-shadow:0 3px 0 var(--line-2)}
.li .dnum.full{background:var(--gold);color:#6b4d00;box-shadow:0 3px 0 var(--gold-deep)}
.wlist{display:flex;flex-direction:column;overflow:hidden}
.wrow{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;padding:13px 12px 13px 14px;border-top:2px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .no{font-size:13px;font-weight:900;color:var(--ink-3);padding-top:5px;font-variant-numeric:tabular-nums}
.wrow .no small{display:block;font-size:11px}
.wrow .w{font-weight:900;font-size:19px;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.wrow .w button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--blue);background:var(--blue-soft)}
.wrow .w button svg{width:18px;height:18px}
.wrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wrow .k{font-size:15px;font-weight:800;line-height:1.5;grid-column:2/4}
.wrow .e{font-size:14.5px;font-weight:700;color:var(--ink-2);line-height:1.4;grid-column:2/4}
.wrow .e + .k{margin-top:5px}
.wrow .x{font-size:12.5px;font-weight:700;color:var(--ink-3);grid-column:2/4;margin-top:3px}
.star{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--line-2)}
.star svg{width:24px;height:24px}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.pill{font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--surface-2);color:var(--ink-3);border:1.5px solid var(--line)}
.p-learn{background:var(--green-soft);color:var(--green-ink)}
.p-master{background:var(--gold-soft);color:var(--gold-ink)}
.p-wrong{background:var(--red-soft);color:var(--red-ink)}
.empty{padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-2);font-size:15px;font-weight:700;line-height:1.6}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:14px;font-weight:900}
.act:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.act i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.act i svg{width:24px;height:24px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:14px 15px 13px;display:flex;flex-direction:column;gap:3px}
.kpi small{font-size:13px;font-weight:900;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi small svg{width:20px;height:20px}
.kpi b{font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;font-weight:700;color:var(--ink-3)}
.chart{padding:16px}
.chart h3{font-size:16.5px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart h3 span{font-size:13px;font-weight:700;color:var(--ink-3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface-3);display:block}
.heat i.l1{background:var(--green-mid)}
.heat i.l2{background:color-mix(in srgb,var(--green) 70%,var(--green-mid))}
.heat i.l3{background:var(--green)}
.heat i.today{outline:2.5px solid var(--orange);outline-offset:1px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bar7{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar7 i{width:100%;max-width:34px;border-radius:10px 10px 5px 5px;background:var(--gold);display:block;min-height:4px}
.bar7 i.zero{background:var(--surface-3)}
.bar7 small{font-size:12px;font-weight:800;color:var(--ink-3)}
.bar7 b{font-size:12px;font-weight:900;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dbars{display:flex;flex-direction:column;gap:8px}
.dbar{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:800}
.dbar span{color:var(--ink-2)}
.dbar .mb{height:10px;border-radius:10px;background:var(--surface-3);overflow:hidden;display:flex}
.dbar .mb i{display:block;height:100%}
.dbar em{font-style:normal;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tests .li .sc{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}

/* settings */
.set{display:flex;flex-direction:column}
.set-h{font-size:14px;font-weight:900;color:var(--ink-3);padding:4px 4px 0;letter-spacing:.02em}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:14px 16px;border-top:2px solid var(--line);flex-wrap:wrap}
.sr:first-child{border-top:0}
.sr .t{flex:1;min-width:160px}
.sr b{display:block;font-weight:900}
.sr .d{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.sr .seg{flex:none}
select{font-size:16px;font-weight:800;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{position:relative;width:54px;height:32px;flex:none}

function faceFront(e) {

}
function faceBack(e) {

}
function stageHTML(e, n) {

    <div class="drag" id="drag"><div class="card3d" id="card" tabindex="0" role="button" aria-label="카드 뒤집기"><div class="face front">${faceFront(e)}</div><div class="face back">${faceBack(e)}</div></div>
    <div class="stamp s-know" id="stampK">${Q ? '알아요' : '이전'}</div><div class="stamp s-dont" id="stampD">${Q ? '몰라요' : '다음'}</div></div></div>`;
}
function renderCardStep(st, e) {
  flipped = false;
  $('qbody').innerHTML = tagHTML(st) + stageHTML(e, Q.sess.steps.length - Q.sess.i - 1);
  $('qfoot').innerHTML = `<div class="row"><button class="btn bad" type="button" data-act="cardDont">몰라요</button><button class="btn" type="button" data-act="cardKnow">알아요</button></div>`;
  bindDrag((dir) => cardAnswer(dir > 0));
  if (state.settings.say && state.settings.front !== 'ko') Voice.play(e.id);
}
function cardAnswer(known) {
  if (Q.locked) return;
  Q.locked = true;
  const st = curStep();
  flyOut(known ? 1 : -1, () => resolve(known, st));
}
function flip() {
  const c = $('card'); if (!c || busy) return;
  flipped = !flipped;
  c.classList.toggle('flipped', flipped);
  Sound.sfx('flip');
  if (flipped && state.settings.front === 'ko' && state.settings.say) { const el = c.querySelector('.face.back > .say'); if (el) Voice.play(el.dataset.id); }
}
function flyOut(dir, done) {
  const d = $('drag');
  if (!d || reduced()) { done(); return; }
  busy = true;
  (dir > 0 ? $('stampK') : $('stampD')).style.opacity = 1;
  d.style.transition = 'transform .24s ease-in, opacity .24s ease-in';
  d.style.transform = `translateX(${dir * 125}%) rotate(${dir * 14}deg)`;
  d.style.opacity = '0';
  setTimeout(() => { busy = false; done(); }, 230);
}
function bindDrag(onSwipe) {
  const el = $('drag');
  if (!el) return;
  el.addEventListener('pointerdown', ev => {
    if (busy || (ev.button && ev.button > 0) || ev.target.closest('[data-act], summary, details')) return;
    drag = { x: ev.clientX, y: ev.clientY, id: ev.pointerId, dx: 0, t: performance.now(), moved: false };
  });
  el.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
      drag.moved = true;
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    drag.dx = dx;
    el.style.transition = 'none';
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    $('stampK').style.opacity = clamp(dx / 90, 0, 1);
    $('stampD').style.opacity = clamp(-dx / 90, 0, 1);
  });
  const end = ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.moved) { if (ev.type === 'pointerup') flip(); return; }
    const v = Math.abs(d.dx) / Math.max(1, performance.now() - d.t);
    if (Math.abs(d.dx) > 90 || (Math.abs(d.dx) > 40 && v > 0.55)) onSwipe(d.dx > 0 ? 1 : -1);
    else { el.style.transition = 'transform .2s'; el.style.transform = ''; $('stampK').style.opacity = 0; $('stampD').style.opacity = 0; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

async function backup() {
  const json = JSON.stringify({ app: APP.backup, v: 2, at: new Date().toISOString(), state });
  const name = APP.backup + '-' + L.dayKey(today()) + '.json';
  if (!PWA && window.claude && window.claude.use) {
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: json }); toast('백업 파일을 저장했어요'); return; } } catch (e) {}
  }
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: APP.name + ' 백업' }); toast('백업 파일을 만들었어요'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 만들었어요');
}
let pickPurpose = '';
function pickFile(purpose) { pickPurpose = purpose; const f = $('filePick'); f.value = ''; f.click(); }
$('filePick').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  let o;
  try { o = JSON.parse(await f.text()); } catch (e) { toast('JSON 파일이 아니에요'); return; }
  if (pickPurpose === 'restore') {
    const src = o && o.app === APP.backup ? (o.state || (o.prog ? L.fromV1({ prog: o.prog, meta: o.meta }) : null)) : null;
    if (!src) { toast(APP.name + ' 백업 파일이 아니에요'); return; }
    const okGo = await confirmSheet('백업으로 되돌릴까요?', '지금 기록은 백업 파일의 기록으로 바뀌어요.', '되돌리기', '취소');
    if (!okGo) return;
    state = L.sanitize(src, W); save(); flush(); applyTheme();
    toast('기록을 되돌렸어요'); go('home');
  } else if (pickPurpose === 'words') {
    const rows = APP.wordsFile && o && o.app === APP.wordsFile && Array.isArray(o.words) ? o.words : null;
    if (!rows) { unlockMsg(APP.name + ' 단어 파일이 아니에요', true); return; }
    localStorage.setItem(K_WORDS, JSON.stringify({ v: o.v || 1, words: rows }));
    startApp(rows);
  }
});

    ${mascot('happy', 'float')}
    <h1>${esc(APP.name)}</h1>
    <p>처음 한 번만 받은 <b>8자리 코드</b>를 입력하세요.<br>단어와 발음을 이 폰에 내려받아요 (약 ${CFG.audio && CFG.audio.mb ? CFG.audio.mb : 20}MB${CFG.audio && CFG.audio.xs ? ` · 예문 소리 ${CFG.audio.xmb || ''}MB는 그 Day를 공부할 때 받아요` : ''}).</p>
    ${!standalone && isIOS ? `<div class="banner">${I.share}<span><b>먼저 홈 화면에 추가하세요.</b> Chrome 주소창 오른쪽 공유 버튼 → ‘홈 화면에 추가’ 후, 홈 화면의 ${esc(APP.name)} 아이콘으로 열어서 코드를 넣어야 앱에 저장돼요.</span></div>` : ''}
    <input class="code" id="codeIn" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" aria-label="8자리 코드">
    <div class="prog" id="unlockProg" hidden><i></i></div>
    <p class="msg" id="unlockMsg" hidden></p>
    <button class="btn" type="button" data-act="unlock" id="unlockBtn">${I.lock}시작하기</button>
    ${APP.wordsFile ? '<button class="link" type="button" data-act="wordsFile">코드 대신 단어 파일로 불러오기</button>' : ''}
    ${W ? '<button class="link" type="button" data-act="settings">돌아가기</button>' : ''}
  </div>`;
  const inp = $('codeIn');
  inp.addEventListener('input', () => { let v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4); inp.value = v; });
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') unlock(); });
}
function unlockMsg(t, err) { const m = $('unlockMsg'); if (!m) return; m.hidden = !t; m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); }
function unlockProg(v) { const p = $('unlockProg'); if (!p) return; p.hidden = v == null; if (v != null) p.firstElementChild.style.width = Math.round(v * 100) + '%'; }
let unlocking = false;
async function unlock() {
  if (unlocking) return;
  const code = ($('codeIn').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 8) { unlockMsg('8자리 코드를 입력해 주세요', true); return; }
  if (!window.crypto || !crypto.subtle) { unlockMsg('이 브라우저에서는 코드를 풀 수 없어요. 최신 Safari나 Chrome으로 열어 주세요.', true); return; }
  unlocking = true; $('unlockBtn').disabled = true;
  try {
    unlockMsg('코드 확인 중…'); unlockProg(0.05);
    const key = await Crypto.derive(code);
    const res = await fetch(CFG.data.words, { cache: 'no-cache' });
    if (!res.ok) throw new Error('net');
    let plain;
    try { plain = await Crypto.open(key, await res.arrayBuffer()); } catch (e) { unlockMsg('코드가 맞지 않아요. 다시 확인해 주세요.', true); unlockProg(null); return; }
    const data = JSON.parse(new TextDecoder().decode(plain));
    localStorage.setItem(K_WORDS, JSON.stringify({ v: data.v || 2, rev: data.rev || '', words: data.words }));
    localStorage.setItem(K_KEY, b64.enc(await crypto.subtle.exportKey('raw', key)));
    Crypto.key = key;
    const days = CFG.audio ? CFG.audio.days : [];
    let done = 0;
    unlockMsg(`발음 받는 중… 0/${days.length}`); unlockProg(0.1);
    const queue = days.slice();
    const store = 'caches' in window ? await caches.open(APP.cache + '-data').catch(() => null) : null;   // the service worker may not control the page yet on the first launch
    const worker = async () => {
      while (queue.length) {
        const d = queue.shift(), url = new URL(Voice.url(d), location.href).href;
        try { if (store) { if (!(await store.match(url))) await store.add(url); } else await (await fetch(url)).arrayBuffer(); } catch (e) {}
        done++; unlockMsg(`발음 받는 중… ${done}/${days.length}`); unlockProg(0.1 + 0.9 * done / days.length);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    unlockMsg(`${fmt(data.words.length)}단어 준비 완료!`);
    await sleep(500);
    if (state) flush();
    Voice.packs.clear(); Voice.bufs.clear(); Voice.order = [];
    startApp(data.words);
  } catch (e) {
    unlockMsg('내려받지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', true); unlockProg(null);
  } finally { unlocking = false; const b = $('unlockBtn'); if (b) b.disabled = false; }
}

/* ---------- friend progress and study reminders ----------
   Only when this build has CFG.sync (a token for the private repo voca-sync, sealed with the app's code) and the learner
   says yes. progress/<app>.json: a daily summary (no per-word data); push/<app>.json: this phone's push subscription and
   reminder hour. The repo's hourly workflow sends the reminder. */
const utf8b64 = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]); return btoa(bin); };
const b64utf8 = s => { const bin = atob(String(s).replace(/\s+/g, '')), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); };
const b64uBytes = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); return b64.dec(s + '='.repeat((4 - s.length % 4) % 4)); };
const Sync = {
  tok: null, sha: {}, t: 0, loading: null,
  ready() { return !!(PWA && CFG.sync && localStorage.getItem(K_KEY)); },
  on() { return this.ready() && state && state.settings.share === true; },
  canNotify() { return !!(this.ready() && CFG.sync.vapid && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window); },
  async token() {
    if (this.tok) return this.tok;
    const res = await fetch(CFG.sync.bin, { cache: 'no-cache' });
    if (!res.ok) throw new Error('sync ' + res.status);
    const plain = await Crypto.open(await Crypto.stored(), await res.arrayBuffer());
    return (this.tok = JSON.parse(new TextDecoder().decode(plain)).token);
  },
  async call(path, opts = {}) {
    const tok = await this.token();
    return fetch(`https://api.github.com/repos/${CFG.sync.repo}/contents/${path}`, Object.assign({ cache: 'no-store' }, opts, {
      headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } }));
  },
  async get(path) {
    const r = await this.call(path);
    if (r.status === 404) { delete this.sha[path]; return null; }
    if (!r.ok) throw new Error('get ' + r.status);
    const j = await r.json();
    this.sha[path] = j.sha;
    return JSON.parse(b64utf8(j.content));
  },
  async put(path, obj) {
    const body = { message: `${CFG.sync.me}: ${path}`, content: utf8b64(JSON.stringify(obj, null, 1) + '\n') };
    for (let k = 0; k < 3; k++) {
      if (!(path in this.sha)) await this.get(path).catch(() => {});   // an existing file needs its sha
      if (this.sha[path]) body.sha = this.sha[path]; else delete body.sha;
      const r = await this.call(path, { method: 'PUT', body: JSON.stringify(body) });
      if (r.ok) { const j = await r.json(); this.sha[path] = j.content && j.content.sha; return true; }
      if (r.status !== 409 && r.status !== 422) throw new Error('put ' + r.status);
      delete this.sha[path];   // someone else wrote it meanwhile: read its sha and try again
    }
    return false;
  },
  summary() {   // what the friend sees: today's status, streak and counts, never the words themselves
    const T = today(), key = L.dayKey(T), d = state.days[key] || {};
    let week = 0; for (let i = 0; i < 7; i++) { const x = state.days[L.dayKey(T - i)]; week += (x && x.xp) || 0; }
    const active = Object.keys(state.days).filter(k => (state.days[k].t || 0) > 0 || (state.days[k].lessons || 0) > 0).sort();
    return { app: APP.id, day: key, studied: (d.t || 0) > 0 || (d.lessons || 0) > 0, done: L.planStatus(state, W, T).finished, xp: d.xp || 0, week,
      streak: L.streak(state, T), best: state.best || 0, learned: Object.keys(state.prog).length,
      mastered: Object.values(state.prog).filter(p => p[0] >= L.MASTER).length, total: W.words.length, last: active[active.length - 1] || '', at: Date.now() };
  },
  async sendProgress() {
    if (!this.on()) return;
    const s = this.summary(), sig = JSON.stringify(Object.assign({}, s, { at: 0 }));
    if (sig === this.lastSig) return;   // nothing new since the last upload
    if (await this.put(`progress/${CFG.sync.me}.json`, s)) this.lastSig = sig;
  },
  soon() { clearTimeout(this.t); this.t = setTimeout(() => this.sendProgress().catch(() => {}), 2500); },
  async loadFriend(force) {   // the other app's summary, at most every 5 minutes
    if (!this.on()) return null;
    const c = state.friend;
    if (!force && c && Date.now() - c.at < 5 * 60e3) return c.data;
    if (this.loading) return this.loading;
    this.loading = this.get(`progress/${CFG.sync.other}.json`)
      .then(f => { state.friend = { data: f, at: Date.now() }; save(); return f; })
      .catch(e => { state.friend = Object.assign({}, state.friend || { data: null }, { at: Date.now(), err: true }); return state.friend.data; })
      .finally(() => { this.loading = null; });
    return this.loading;
  },
  async enable() {   // call inside a tap: Safari asks for permission only in response to one
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { state.settings.notify = false; save(); return perm; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(CFG.sync.vapid) });
    state.settings.notify = true; save();
    await this.savePush(sub);
    return 'granted';
  },
  async savePush(sub) {   // this phone's subscription (a phone keeps at most 3), whether reminders are on, and their hour
    const path = `push/${CFG.sync.me}.json`, cur = (await this.get(path).catch(() => null)) || {};
    let subs = (cur.subs || []).filter(s => !sub || s.endpoint !== sub.endpoint);

  },
  async refreshPush() {   // on launch: iOS can hand out a new subscription; keep the stored one current

    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(CFG.sync.vapid) });

const hourText = h => (h >= 18 ? '저녁 ' : h >= 12 ? '오후 ' : '오전 ') + (h > 12 ? h - 12 : h) + '시';   // 20 -> 저녁 8시

  const k = el.dataset.set;
  state.settings[k] = el.type === 'checkbox' ? el.checked : /^\d+$/.test(el.value) ? Number(el.value) : el.value;
  if (k === 'start') L.refreshPlan(state, W, today());
  if (k === 'silent') Sound.session();
  if (k === 'share') {
    if (!el.checked && state.settings.notify) { state.settings.notify = false; Sync.savePush(null).catch(() => {}); }   // reminders need today's progress
    if (el.checked) { Sync.sendProgress().catch(() => {}); Sync.loadFriend(true).then(() => renderSettings()); }
    else { Sync.lastSig = ''; Sync.put(`progress/${CFG.sync.me}.json`, { app: APP.id, off: true, at: Date.now() }).catch(() => {}); }
    renderSettings();
  }
  if (k === 'notify') {
    if (el.checked && !state.settings.share) { state.settings.notify = false; el.checked = false; toast('진도 공유를 먼저 켜 주세요'); }
    else if (el.checked) { state.settings.notify = false; turnOnNotify(); }   // on once the permission and subscription work
    else Sync.savePush(null).catch(() => {});
  }
  if (k === 'notifyHour' && state.settings.notify) Sync.savePush(null).catch(() => {});
  save();
});
// every tap: resume Web Audio (or replace a stuck context) inside the user activation; touchend and click count as one
const tapAudio = () => { Sound.wake(); Sound.unlock(); if (state && W) askNotifyOnTap(); };
document.addEventListener('touchend', tapAudio, { capture: true, passive: true });
document.addEventListener('click', tapAudio, { capture: true, passive: true });
document.addEventListener('keydown', ev => {
  if (!$('sheet').hidden) { if (ev.key === 'Escape') closeSheet(null); return; }
  const inField = ev.target.closest && ev.target.closest('input,select,textarea');
  if (screen === 'quiz' && Q) {
    if (ev.repeat && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); return; }
    const st = curStep(), fbOpen = $('fb').classList.contains('show');
    if (inField) {
      if (ev.key === 'Enter' && !ev.isComposing && (ev.target.id === 'spellIn' || ev.target.id === 'koIn')) { ev.preventDefault(); if (fbOpen) { if (!document.querySelector('#fbIn [data-act="koSelf"]')) cont(); } else if (ev.target.id === 'koIn') koGo(); else spellGo(); }
      return;
    }
    if (fbOpen) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); cont(); } return; }
    if (!st) return;
    if (st.k === 'learn') { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); nextLearn(); } }
    else if (st.q && st.q.t === 'card') {
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(); }
      else if (ev.key === 'ArrowRight') cardAnswer(true);
      else if (ev.key === 'ArrowLeft') cardAnswer(false);
    } else if (st.q && st.q.t === 'multi') { if (/^[1-6]$/.test(ev.key)) mtoggle(Number(ev.key) - 1); else if (ev.key === 'Enter') { ev.preventDefault(); multiGo(); } }
    else if (st.q && st.q.opts && /^[1-4]$/.test(ev.key)) pick(Number(ev.key) - 1);
    if ((ev.key === 's' || ev.key === 'S') && st.q && !['mcq-en', 'spell', 'cloze', 'clozet'].includes(st.q.t)) Voice.play(st.id);
    if (ev.key === 'Escape') quitRun();
    return;
  }
  if (inField) return;
  if (screen === 'browse' && B) {
    if (ev.key === 'ArrowRight') browseMove(1, false);
    else if (ev.key === 'ArrowLeft') browseMove(-1, false);
    else if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(); }
    else if (ev.key === 's' || ev.key === 'S') Voice.play(B.ids[B.i]);
    else if (ev.key === 'Escape') ACT.browseClose();
  } else if (screen === 'auto' && A) {
    if (ev.key === ' ') { ev.preventDefault(); ACT.autoToggle(); }
    else if (ev.key === 'ArrowRight') ACT.autoNext();
    else if (ev.key === 'ArrowLeft') ACT.autoPrev();
    else if (ev.key === 'Escape') ACT.autoClose();
  }
});

/* ---------- boot ---------- */
function paintTabs() {
  const t = [['home', I.home, '홈'], ['words', I.book, '단어장'], ['test', I.quiz, '테스트'], ['stats', I.chart, '기록']];
  for (const [k, ic, label] of t) $('tab-' + k).innerHTML = ic + `<span>${label}</span>`;
  document.querySelector('[data-act="quit"]').innerHTML = I.close;
}
async function refreshWords() {   // a newer word list was published: swap it in quietly
  try {
    const res = await fetch(CFG.data.words, { cache: 'no-cache' });
    if (!res.ok) return;
    const data = JSON.parse(new TextDecoder().decode(await Crypto.open(await Crypto.stored(), await res.arrayBuffer())));
    if (!Array.isArray(data.words) || !data.words.length || data.rev !== CFG.data.rev) return;   // an older cached copy: try again next launch
    localStorage.setItem(K_WORDS, JSON.stringify({ v: data.v || 2, rev: data.rev, words: data.words }));
    if (screen === 'quiz' || screen === 'browse' || screen === 'auto') return;   // takes effect on the next launch
    W = L.prepare(data.words);
    state = L.sanitize(state, W);
    if (screen === 'home') renderHome();
  } catch (e) {}
}
function storedRev() { try { return (JSON.parse(localStorage.getItem(K_WORDS) || '{}') || {}).rev || ''; } catch (e) { return ''; } }
function startApp(rows) {
  W = L.prepare(rows);
  state = L.sanitize(Local.read(), W);
  syncedAt = state.at || 0;
  settleSessions();
  if (state.lesson && !sessionActive(state.lesson, today())) state.lesson = null;
  applyTheme();
  go('home');
  if (PWA && CFG.data && CFG.data.rev && storedRev() !== CFG.data.rev && localStorage.getItem(K_KEY)) refreshWords();
  if (PWA && localStorage.getItem(K_KEY)) setTimeout(() => Voice.topUp(), 4000);
  if (Sync.ready()) setTimeout(() => {
    Sync.sendProgress().catch(() => {});
    Sync.refreshPush().catch(() => {});
    Sync.loadFriend().then(() => { if (screen === 'home') renderHome(); else if (screen === 'stats') renderStats(); });
  }, 2000);
  if (!PWA) {
    Cloud.connect().then(cloud => {
      if (!Cloud.ready) return;
      state = L.sanitize(mergeStates(state, cloud ? L.sanitize(cloud, W) : null), W);
      Local.write(state);
      Cloud.flush();
      if (screen === 'home') renderHome(); else if (screen === 'settings') renderSettings();
    }).catch(e => console.warn(`[${APP.name}] 계정 저장소 연결 실패, 이 브라우저에 저장해요`, e));
  }
}
function boot() {
  paintTabs();
  if (PWA && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
  const rows = storedRows();
  if (rows) { startApp(rows); return; }
  if (!PWA) { $('s-boot').innerHTML = '<div class="wrap unlock"><p class="muted" style="text-align:center">단어 데이터를 찾지 못했어요.</p></div>'; return; }
  renderUnlock();
  show('unlock');
}
boot();
})();
